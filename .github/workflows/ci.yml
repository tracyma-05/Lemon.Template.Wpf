name: CI

on:
  push:
    branches: [main]
    # A vX.Y.Z tag runs the whole pipeline and then publishes the package it produced.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the packed template to nuget.org'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  build:
    name: Build and test
    # WPF needs Windows; net*-windows will not build on ubuntu runners.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The application targets net10.0-windows, so the released .NET 10 SDK is enough.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lemon.Template.Wpf.sln

      - name: Build
        # TreatWarningsAsErrors is on, so a new warning fails here by design.
        run: dotnet build Lemon.Template.Wpf.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test Lemon.Template.Wpf.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

  template:
    name: Template round-trip
    # Building the repository is not enough: the template engine strips the conditional blocks that the
    # repository itself compiles with enabled, so the scaffolded output has to be built separately.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the template from source
        run: dotnet new install .

      - name: Scaffold with default options
        run: dotnet new lemon-wpf -n Acme.FullApp -o "${{ runner.temp }}/Full"

      - name: Build the default scaffold
        run: dotnet build "${{ runner.temp }}/Full/src/Acme.FullApp/Acme.FullApp.csproj" -c Release

      - name: Test the default scaffold
        run: dotnet test "${{ runner.temp }}/Full/tests/Acme.FullApp.Tests/Acme.FullApp.Tests.csproj" -c Release

      - name: Scaffold with every optional feature disabled
        run: >
          dotnet new lemon-wpf -n Acme.MinApp -o "${{ runner.temp }}/Min"
          --EnableHangfire false --EnableTrayIcon false --IncludeTests false

      - name: Build the minimal scaffold
        run: dotnet build "${{ runner.temp }}/Min/src/Acme.MinApp/Acme.MinApp.csproj" -c Release

      - name: Assert disabled features left nothing behind
        shell: pwsh
        run: |
          $min = "${{ runner.temp }}/Min"
          $failures = @()

          foreach ($path in @(
              "$min/src/Acme.MinApp/Services/Hangfire",
              "$min/src/Acme.MinApp/Views/Tools",
              "$min/src/Acme.MinApp/ViewModels/Tools",
              "$min/tests")) {
            if (Test-Path $path) { $failures += "should not exist: $path" }
          }

          # Unprocessed conditional markers mean a directive was malformed and shipped verbatim.
          $leftovers = Get-ChildItem "$min" -Recurse -File -Include *.cs,*.csproj,*.xaml `
            | Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } `
            | Select-String -Pattern '#if \(Enable', '#endif' -List
          foreach ($hit in $leftovers) { $failures += "leftover template directive in $($hit.Path)" }

          # Features that were switched off must not be referenced any more.
          $stray = Select-String -Path "$min/src/Acme.MinApp/Acme.MinApp.csproj" `
            -Pattern 'Hangfire', 'NotifyIcon', 'WebView2', 'Microsoft.AspNetCore.App'
          foreach ($hit in $stray) { $failures += "disabled dependency still referenced: $($hit.Line.Trim())" }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'Minimal scaffold is clean.'

      - name: Pack the template
        run: dotnet pack Lemon.Template.Wpf.TemplatePack.csproj -c Release -o artifacts/package

      - name: Upload template package
        uses: actions/upload-artifact@v4
        with:
          name: template-package
          path: artifacts/package/*.nupkg

      - name: Uninstall the template
        if: always()
        run: dotnet new uninstall .

  publish:
    name: Publish to NuGet
    # Only the package that already passed build, test and the round-trip check is pushed.
    needs: [build, template]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    # Pushing a .nupkg needs no WPF toolchain, so the cheaper runner is enough.
    runs-on: ubuntu-latest
    # nuget.org binds Trusted Publishing to this workflow file *and* this environment name; renaming either
    # side invalidates the OIDC exchange and the run falls back to the API key.
    environment: production
    permissions:
      contents: read
      # Lets NuGet/login exchange the workflow's OIDC token for a short-lived API key.
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download the template package
        uses: actions/download-artifact@v4
        with:
          name: template-package
          path: artifacts/package

      - name: Check the tag matches the packed version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shopt -s nullglob
          files=(artifacts/package/*.nupkg)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::expected exactly one .nupkg, found ${#files[@]}"
            exit 1
          fi
          # Lemon.Templates.Wpf.1.0.2.nupkg -> 1.0.2
          version=$(basename "${files[0]}" .nupkg)
          version=${version#Lemon.Templates.Wpf.}
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packed version ${version} — bump Version in common.props"
            exit 1
          fi
          echo "Publishing Lemon.Templates.Wpf ${version}."

      - name: Request a temporary API key (Trusted Publishing)
        id: nuget-login
        # Opt out with the NUGET_USE_TRUSTED_PUBLISHING variable; a failed exchange (policy removed, OIDC
        # unavailable) must not stop the job either, because the API key below still works.
        if: vars.NUGET_USE_TRUSTED_PUBLISHING != 'false'
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'tracy.ma' }}

      - name: Select the push credentials
        env:
          TRUSTED_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          STATIC_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$TRUSTED_KEY" ]; then
            echo 'Using the short-lived key from Trusted Publishing.'
            printf 'NUGET_PUSH_KEY=%s\n' "$TRUSTED_KEY" >> "$GITHUB_ENV"
          elif [ -n "$STATIC_KEY" ]; then
            echo 'Trusted Publishing unavailable; falling back to the NUGET_API_KEY secret.'
            printf 'NUGET_PUSH_KEY=%s\n' "$STATIC_KEY" >> "$GITHUB_ENV"
          else
            echo '::error::no NuGet credentials: configure Trusted Publishing for this repository/workflow/environment, or set the NUGET_API_KEY secret'
            exit 1
          fi

      - name: Push
        run: >
          dotnet nuget push artifacts/package/*.nupkg
          --source "$NUGET_SOURCE" --api-key "$NUGET_PUSH_KEY" --skip-duplicate
